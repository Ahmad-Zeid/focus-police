<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Police · Record a session</title>
<style>
/* Hallmark · macrostructure: workflow · tone: direct · anchor hue: green */
/* Hallmark · pre-emit critique: P4 H5 E4 S5 R5 V4 */
:root {
  color-scheme: light dark;
  --paper: oklch(0.973 0.009 92); --ink: oklch(0.244 0.025 160);
  --muted: oklch(0.445 0.028 157); --line: oklch(0.84 0.016 145);
  --surface: oklch(0.994 0.004 92); --accent: oklch(0.405 0.099 160);
  --accent-hover: oklch(0.34 0.087 160); --on-accent: oklch(0.99 0.005 92);
  --alert: oklch(0.44 0.147 31); --focus: oklch(0.53 0.151 245);
  --font-body: "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --font-display: Georgia, serif; --font-timer: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: oklch(0.205 0.013 160); --ink: oklch(0.95 0.01 92);
    --muted: oklch(0.76 0.024 155); --line: oklch(0.41 0.022 154);
    --surface: oklch(0.25 0.017 154); --accent: oklch(0.80 0.134 160);
    --accent-hover: oklch(0.86 0.12 160); --on-accent: oklch(0.20 0.023 160);
    --alert: oklch(0.83 0.101 38); --focus: oklch(0.77 0.116 245);
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--font-body); }
[hidden] { display: none !important; }
.wrap { width: min(100% - 32px, 688px); margin: 0 auto; }
header { display: flex; gap: 8px 20px; flex-wrap: wrap; justify-content: space-between; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--line); }
header a { color: var(--ink); font-weight: 700; text-decoration: none; }
#connection { font-size: .875rem; color: var(--muted); }
#connection.ready { color: var(--accent); }
main { padding: clamp(24px, 6vw, 56px) 0; }
h1 { font: 400 clamp(2rem, 6vw, 3.25rem)/1.06 var(--font-display); margin: 0 0 12px; overflow-wrap: anywhere; }
p { margin: 0 0 16px; }
.muted { color: var(--muted); }
.error { color: var(--alert); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
.fields label { display: grid; gap: 4px; min-width: 0; font-weight: 650; }
input, select { width: 100%; min-width: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 8px 10px; min-height: 44px; font: inherit; border-radius: 4px; }
input[type=checkbox] { width: auto; min-height: 0; accent-color: var(--accent); }
button { min-height: 44px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; padding: 8px 16px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { background: var(--accent-hover); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .55; cursor: default; }
button.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
button.secondary:hover:not(:disabled) { background: var(--paper); border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
details { margin-top: 24px; padding: 12px 0; border-top: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 650; }
#acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; margin-top: 12px; }
#acts label { display: flex; align-items: baseline; gap: 8px; }
#stage { text-align: center; padding: clamp(16px, 5vw, 44px) 0; }
#step { margin-bottom: 12px; }
#instruction { margin: 0 auto 16px; max-width: 42ch; }
#clock { font: 500 clamp(3rem, 15vw, 6.5rem)/1.12 var(--font-timer); font-variant-numeric: tabular-nums; margin-bottom: 12px; }
progress { width: 100%; height: 8px; accent-color: var(--accent); display: block; margin: 0 auto 24px; }
#stage .actions { justify-content: center; }
#phase { min-height: 1.5em; font-weight: 650; }
#checkimg { display: block; max-width: 100%; margin-top: 12px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: .8rem/1.5 var(--font-timer); }
@media (max-width: 420px) {
  .fields, #acts { grid-template-columns: minmax(0, 1fr); }
  header { padding: 12px 0; }
}
</style>
</head>
<body>
<header class="wrap">
  <a href="/">Focus Police</a>
  <span id="connection" role="status">Checking for the watch…</span>
</header>
<main class="wrap">
  <section id="setup" aria-labelledby="setup-title">
    <h1 id="setup-title">Record a session</h1>
    <p class="muted">Tap <strong>START</strong> on the watch. The laptop will guide you through one activity at a time.</p>
    <div class="fields">
      <label><span id="session-label">Session</span><select id="session" aria-labelledby="session-label">
        <option value="PILOT" selected>Practice · PILOT</option>
        <optgroup label="Training"><option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option></optgroup>
        <option value="TEST">Separate test · TEST</option>
        <optgroup label="Extra tests"><option value="NATURAL">Natural use</option><option value="OTHERHAND">Phone in other hand</option></optgroup>
      </select></label>
      <label>Participant ID<input id="participant" value="P1" maxlength="20" autocomplete="off"></label>
      <label><span id="wrist-label">Watch wrist</span><select id="wrist" aria-labelledby="wrist-label"><option>left</option><option>right</option></select></label>
      <label><span id="hand-label">Writing hand</span><select id="dominant" aria-labelledby="hand-label"><option>right</option><option>left</option></select></label>
    </div>
    <p id="plan" class="muted"></p>
    <div class="actions"><button id="go" disabled>Start session</button></div>
    <details>
      <summary>Recording options</summary>
      <div class="fields">
        <label>Seconds per activity<input id="dur" type="number" value="60" min="15" max="600" step="5"></label>
        <label>Rounds<input id="rounds" type="number" value="2" min="1" max="6"></label>
        <label><span id="posture-label">Posture</span><select id="posture" aria-labelledby="posture-label"><option>sitting</option><option>standing</option></select></label>
        <label>Session note<input id="setupnote" placeholder="e.g. new desk, different mug"></label>
      </div>
      <div id="acts"></div>
    </details>
  </section>

  <section id="stage" hidden aria-labelledby="activity">
    <p class="muted" id="step"></p>
    <h1 id="activity" tabindex="-1"></h1>
    <p class="muted" id="instruction"></p>
    <div id="clock" aria-hidden="true"></div>
    <progress id="progress" aria-label="Elapsed activity time" value="0"></progress>
    <p id="phase" role="status"></p>
    <div class="actions">
      <button id="action"></button>
      <button id="redo" class="secondary" hidden>Redo activity</button>
      <button id="end" class="secondary">End session</button>
    </div>
  </section>

  <section id="done" hidden aria-labelledby="result">
    <h1 id="result" tabindex="-1"></h1>
    <p id="save-message" role="status"></p>
    <div class="actions">
      <button id="save-again" hidden>Retry save</button>
      <button id="download" class="secondary" hidden>Download labels</button>
      <button id="back" class="secondary" hidden>Back to setup</button>
    </div>
    <details id="review" hidden>
      <summary>Review saved labels</summary>
      <pre id="details"></pre>
      <img id="checkimg" alt="Watch activity plot with the labelled time ranges highlighted" hidden>
    </details>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const DEFAULTS = [
  ["typing", "Type on the laptop", "Type normally, with both hands as you usually do."],
  ["writing", "Write on paper", "Use your usual writing hand. Copy a few sentences or take notes."],
  ["idle", "Read quietly", "Read from the screen or paper. Rest your hands as you normally would."],
  ["drinking", "Drink from a cup or bottle", "Take a sip, set it down, and repeat with pauses."],
  ["hold_cup", "Hold a cup or bottle", "Hold it in the hand wearing the watch, without drinking."],
  ["phone_scroll", "Scroll on your phone", "Hold it in the hand wearing the watch and browse a feed."],
  ["phone_text", "Type on your phone", "Hold it in the hand wearing the watch. Type a draft with one or both thumbs."],
  ["phone_call", "Hold the phone to your ear", "Use the hand wearing the watch. You can pretend to talk."],
];
const OPTIONAL = ["calculator", "Use a physical calculator (optional)", "Enter a few sums on a separate calculator."];
const NATURAL = [
  ["natural_work", "Work as you normally would", "Type, read, write, or drink as you would during a real work session."],
  ["natural_phone", "Use your phone normally", "Use whichever hand you would normally use."],
];
const OTHERHAND = DEFAULTS.slice(-3).map(([id, title]) => [
  id + "_other", title, "Use the hand without the watch. Let the watch hand rest.",
]);
const activities = new Map([...DEFAULTS, OPTIONAL, ...NATURAL, ...OTHERHAND].map(a => [a[0], a]));
for (const [key, title] of [...DEFAULTS, OPTIONAL]) {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.value = key;
  input.checked = key !== OPTIONAL[0];
  label.append(input, title);
  $("acts").append(label);
}

let blocks = [], rows = [], meta, recording, lastStatus, index = 0, completed = 0;
let mode = "setup", ticker, startedAt, startedEpochMs, startedWatchMs, busy = false;

function shuffle(keys, seed) {
  let state = 0;
  for (const char of seed) state = Math.imul(31, state) + char.charCodeAt(0) | 0;
  for (let i = keys.length - 1; i > 0; i--) {
    state = Math.imul(1664525, state) + 1013904223 | 0;
    const j = (state >>> 0) % (i + 1);
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  return keys;
}

function plan() {
  const session = $("session").value;
  if (session === "PILOT") return [["typing", 20], ["phone_text", 20]].map(([key, dur]) => ({key, dur, round: 1}));
  if (session === "NATURAL") {
    return [1, 2, 3].flatMap(round => [{key: "natural_work", dur: 180, round}, {key: "natural_phone", dur: 90, round}]);
  }
  const keys = session === "OTHERHAND" ? OTHERHAND.map(a => a[0])
    : [...$("acts").querySelectorAll("input:checked")].map(input => input.value);
  const dur = Math.max(15, Math.min(600, Math.round(Number($("dur").value) || 60)));
  const rounds = session === "OTHERHAND" ? 1 : Math.max(1, Math.min(6, Math.round(Number($("rounds").value) || 2)));
  const result = [];
  for (let round = 1; round <= rounds; round++) {
    const order = shuffle([...keys], session + "-" + round);
    if (order.length > 1 && order[0] === result.at(-1)?.key) order.push(order.shift());
    result.push(...order.map(key => ({key, dur, round})));
  }
  return result;
}

function watchReady(status) {
  return !!status?.session && Number.isFinite(status.watch_epoch_s)
    && status.device !== "replay" && !status.recording_labelled;
}

function showPlan() {
  const planBlocks = plan();
  const fixed = ["PILOT", "NATURAL", "OTHERHAND"].includes($("session").value);
  for (const control of [$("dur"), $("rounds"), ...$("acts").querySelectorAll("input")]) control.disabled = fixed;
  const seconds = planBlocks.reduce((total, block) => total + block.dur, 0);
  $("plan").textContent = $("session").value === "PILOT" ? "Laptop typing and phone texting · 20 seconds each"
    : planBlocks.length ? planBlocks.length + " activities · " + Math.ceil(seconds / 60) + " min plus breaks"
    : "Select at least one activity in Recording options.";
  $("go").disabled = !watchReady(lastStatus) || !planBlocks.length;
}

async function readStatus() {
  const response = await fetch("/status", {cache: "no-store", signal: AbortSignal.timeout(3000)});
  if (!response.ok) throw new Error("The receiver did not answer.");
  return response.json();
}

async function refreshStatus() {
  try { lastStatus = await readStatus(); } catch { lastStatus = null; }
  const ready = watchReady(lastStatus);
  const status = $("connection");
  status.textContent = ready ? "Watch streaming" : lastStatus?.connected && lastStatus.recording_labelled
    ? "Tap STOP, then START on the watch" : "Waiting for live watch data";
  status.classList.toggle("ready", ready);
  if (mode === "setup") showPlan();
}

function log(event, blockIndex = -1, epochMs = Date.now(), watchMs = "", note = "") {
  const block = blocks[blockIndex];
  rows.push([meta.session, meta.participant, meta.wrist, meta.dominant, meta.posture,
    blockIndex, block?.round ?? "", block?.key ?? "", event, epochMs, new Date(epochMs).toISOString(), note, watchMs]);
}

const headers = ["session", "participant", "watch_wrist", "dominant_hand", "posture", "index",
  "round", "activity", "event", "epoch_ms", "iso_time", "note", "watch_epoch_ms"];
const csv = () => [headers, ...rows].map(row => row.map(field => '"' + String(field).replaceAll('"', '""') + '"').join(",")).join("\n");
const filename = () => meta.session + "_" + meta.participant + "_runner.csv";
const format = seconds => Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");

function showActivity() {
  mode = "ready";
  const block = blocks[index];
  const [, name, instruction] = activities.get(block.key);
  $("step").textContent = "Activity " + (index + 1) + " of " + blocks.length;
  $("activity").textContent = name;
  $("instruction").textContent = instruction;
  $("clock").textContent = format(block.dur);
  $("progress").max = block.dur;
  $("progress").value = 0;
  $("phase").textContent = "Start when you’re ready.";
  $("phase").className = "";
  $("action").textContent = "Start activity";
  $("action").disabled = false;
  $("redo").hidden = true;
  $("end").textContent = "End session";
  $("activity").focus();
}

$("go").onclick = () => {
  blocks = plan();
  if (!watchReady(lastStatus) || !blocks.length) return;
  const participant = $("participant").value.trim().replace(/[^A-Za-z0-9_-]/g, "_") || "P1";
  meta = {session: $("session").value, participant, wrist: $("wrist").value,
    dominant: $("dominant").value, posture: $("posture").value};
  recording = lastStatus.session;
  rows = [];
  index = 0;
  completed = 0;
  log("session_open", -1, Date.now(), "", $("setupnote").value.trim());
  $("setup").hidden = true;
  $("stage").hidden = false;
  showCalibration();
};

// Calibration: 5 s with both hands resting on the keyboard. The receiver saves that wrist pose as
// calibration.json next to the recording; training and the live model read every movement relative to it,
// which removes how the strap sits and each person's resting posture.
function showCalibration() {
  mode = "calibrate";
  $("step").textContent = "Before the first activity";
  $("activity").textContent = "Calibrate the watch";
  $("instruction").textContent = "Rest both hands on the laptop keyboard as if you are about to type. Keep still while the timer runs.";
  $("clock").textContent = format(5);
  $("progress").max = 5;
  $("progress").value = 0;
  $("phase").textContent = "Press Calibrate when your hands are in place.";
  $("phase").className = "";
  $("action").textContent = "Calibrate";
  $("action").disabled = false;
  $("redo").hidden = true;
  $("activity").focus();
}

async function calibrate() {
  busy = true;
  $("action").disabled = true;
  $("end").disabled = true;
  try {
    for (let s = 5; s > 0; s--) {
      $("clock").textContent = format(s);
      $("progress").value = 5 - s;
      $("phase").textContent = "Keep still…";
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
    $("progress").value = 5;
    const response = await fetch("/calibrate", {method: "POST", signal: AbortSignal.timeout(5000)});
    const result = await response.json();
    if (!result.ok) throw new Error(result.error || "Calibration failed.");
    log("calibrate", -1, Date.now(), "", "pose " + Math.round(result.face_up_deg) + " deg from face-up");
    showActivity();
  } catch (error) {
    $("phase").textContent = error.message + " Press Calibrate to try again.";
    $("phase").className = "error";
    $("clock").textContent = format(5);
    $("action").disabled = false;
  } finally {
    busy = false;
    $("end").disabled = false;
  }
}

function finishActivity() {
  clearInterval(ticker);
  const milliseconds = blocks[index].dur * 1000;
  log("end", index, startedEpochMs + milliseconds, startedWatchMs + milliseconds);
  completed++;
  mode = "between";
  $("phase").textContent = "Done. You can stop this activity.";
  $("action").textContent = index + 1 < blocks.length ? "Next activity" : "Save session";
  $("action").disabled = false;
  $("redo").hidden = false;
  $("action").focus();
}

function tick() {
  const duration = blocks[index].dur;
  const elapsed = (performance.now() - startedAt) / 1000;
  $("clock").textContent = format(Math.max(0, Math.ceil(duration - elapsed)));
  $("progress").value = Math.min(duration, elapsed);
  if (elapsed >= duration) finishActivity();
}

$("action").onclick = async () => {
  if (busy) return;
  if (mode === "calibrate") return calibrate();
  if (mode === "between") {
    if (++index < blocks.length) showActivity();
    else endSession();
    return;
  }
  if (mode !== "ready") return;
  busy = true;
  $("action").disabled = true;
  $("end").disabled = true;
  $("phase").textContent = "Checking the watch…";
  try {
    const status = await readStatus();
    if (status.session && status.session !== recording) throw new Error("The watch started a new recording. End this session and start again.");
    if (!watchReady(status)) throw new Error("The watch isn’t streaming. Check the connection, then try again.");
    startedAt = performance.now();
    startedEpochMs = Date.now();
    startedWatchMs = Math.round(status.watch_epoch_s * 1000);
    log("start", index, startedEpochMs, startedWatchMs);
    mode = "running";
    $("action").textContent = "Activity running";
    $("phase").textContent = "Keep going until the timer ends.";
    $("phase").className = "";
    ticker = setInterval(tick, 100);
    tick();
  } catch (error) {
    $("phase").textContent = error.message;
    $("phase").className = "error";
    $("action").disabled = false;
  } finally {
    busy = false;
    $("end").disabled = false;
  }
};

$("redo").onclick = () => {
  if (mode !== "between") return;
  // Remove both markers for this take so only the next take can be labelled.
  rows = rows.filter(row => row[5] !== index);
  completed--;
  showActivity();
};

$("end").onclick = () => {
  if (busy) return;
  if (mode === "running") {
    if (!confirm("End this session? The current activity will be dropped and completed activities will be saved.")) return;
    rows = rows.filter(row => row[5] !== index);
  }
  endSession();
};

function endSession() {
  clearInterval(ticker);
  mode = "done";
  log("session_end");
  $("stage").hidden = true;
  $("done").hidden = false;
  $("checkimg").hidden = true;
  $("review").hidden = true;
  if (completed) save();
  else {
    $("result").textContent = "No activities completed";
    $("save-message").textContent = "No labels to save. Tap STOP on the watch before starting a new session.";
    $("back").hidden = false;
    $("download").hidden = true;
  }
  $("result").focus();
}

async function save() {
  $("result").textContent = "Saving session…";
  $("save-message").textContent = "Leave the watch recording until the labels are saved.";
  $("save-message").className = "";
  for (const id of ["save-again", "download", "back"]) $(id).hidden = true;
  const query = new URLSearchParams({name: filename(), recording});
  try {
    const response = await fetch("/runner-log?" + query, {method: "POST", body: csv()});
    const result = await response.json();
    if (!result.saved) throw new Error(result.error || "The receiver did not save the activity log.");
    const count = result.blocks ?? completed;
    $("result").textContent = result.ok && count === completed ? "Session saved" : "Recording needs a label check";
    $("save-message").textContent = result.ok ? count + " of " + completed + " activities labelled. Tap STOP on the watch."
      : "The recording and activity log are saved. Tap STOP on the watch and review the label details.";
    $("details").textContent = result.output || "";
    $("review").hidden = !result.output;
    $("review").open = !result.ok || count !== completed;
    if (result.ok) {
      $("checkimg").src = "/check?" + new URLSearchParams({folder: result.folder, t: Date.now()});
      $("checkimg").hidden = false;
    }
    $("back").hidden = false;
  } catch (error) {
    $("result").textContent = "Labels couldn’t be saved";
    $("save-message").textContent = error.message + " Retry the save or download the activity log.";
    $("save-message").className = "error";
    $("save-again").hidden = false;
    $("back").hidden = false;
  }
  $("download").hidden = false;
}

$("save-again").onclick = save;
$("back").onclick = () => {
  mode = "setup";
  $("done").hidden = true;
  $("setup").hidden = false;
  showPlan();
  refreshStatus();
};
$("download").onclick = () => {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv()], {type: "text/csv"}));
  link.download = filename();
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};
$("setup").addEventListener("change", showPlan);
showPlan();
refreshStatus().finally(() => setInterval(refreshStatus, 1000));
</script>
</body>
</html>
