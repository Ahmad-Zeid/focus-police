<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Police recorder</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --ink: #1c2b33; --muted: #6a7880; --line: #e2e0d8; --on: #1f8a70; --off: #d1492e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12181b; --card: #1b2327; --ink: #eef1f0; --muted: #93a0a6; --line: #2b363b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  a { color: var(--muted); font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  input, select { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
                  color: var(--ink); width: 100%; min-height: 44px; }
  button { font: inherit; font-weight: 600; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); min-height: 48px; }
  button:disabled { opacity: .4; }
  #toggle { width: 100%; background: var(--on); color: #fff; border: 0; margin-top: 12px; }
  #toggle.rec { background: var(--off); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #now { font-size: 28px; font-weight: 650; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); }
  #status, #msg { font-size: 14px; color: var(--muted); }
  #msg.err { color: var(--off); }
</style>
</head>
<body>
<main>
  <header><h1>Recorder</h1><a href="/">Dashboard</a></header>

  <section class="card">
    <div class="label">Session</div>
    <div class="fields">
      <label>Person<input id="person" placeholder="ahmad" autocapitalize="off"></label>
      <label>Session name<input id="session" placeholder="scripted1" autocapitalize="off"></label>
      <label>Wrist<select id="wrist"><option>dominant</option><option>non-dominant</option></select></label>
      <label>Desk<input id="desk" placeholder="library"></label>
      <label>Kind<select id="kind"><option>scripted</option><option>unscripted</option></select></label>
      <label>Device<input id="device" placeholder="Galaxy Watch"></label>
    </div>
    <button id="toggle">Start recording</button>
    <div id="status">Checking sensor</div>
    <div id="msg"></div>
  </section>

  <section class="card">
    <div class="label">Current label</div>
    <div id="now">none</div>
    <div id="clock">0:00 in this label</div>
  </section>

  <section class="card">
    <div class="label">Tap when the activity changes</div>
    <div class="grid" id="labels"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let recording = false, since = Date.now();

async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function say(text, err) { $("msg").textContent = text; $("msg").className = err ? "err" : ""; }
function mark(label) {
  $("now").textContent = label.replace("_", " ");
  since = Date.now();
  document.querySelectorAll("#labels button").forEach(b => b.classList.toggle("active", b.dataset.label === label));
}
function setRecording(on) {
  recording = on;
  $("toggle").textContent = on ? "Stop and save" : "Start recording";
  $("toggle").classList.toggle("rec", on);
  document.querySelectorAll("#labels button").forEach(b => b.disabled = !on);
}

$("toggle").onclick = async () => {
  try {
    if (!recording) {
      const meta = Object.fromEntries(["person", "session", "wrist", "desk", "kind", "device"].map(k => [k, $(k).value.trim()]));
      const r = await post("/api/record/start", meta);
      setRecording(true); mark("none"); say(`Recording to ${r.path}`);
    } else {
      const r = await post("/api/record/stop");
      setRecording(false); mark("none");
      say(`Saved ${r.path}: ${mmss(r.seconds)}, ${r.rate_hz.toFixed(1)} Hz, ${r.labels} labelled blocks`);
    }
  } catch (e) { say(e.message, true); }
};

fetch("/api/config").then(r => r.json()).then(cfg => {
  $("labels").innerHTML = [...cfg.fine_labels, "none"].map(l =>
    `<button data-label="${l}" disabled>${l.replace("_", " ")}</button>`).join("");
  document.querySelectorAll("#labels button").forEach(b => b.onclick = async () => {
    try { await post("/api/record/label", {label: b.dataset.label}); mark(b.dataset.label); say(""); }
    catch (e) { say(e.message, true); }
  });
});

setInterval(async () => {
  $("clock").textContent = `${mmss((Date.now() - since) / 1000)} in this label`;
  try {
    const s = await (await fetch("/api/state")).json();
    $("status").textContent = s.connected
      ? `Sensor live at ${s.rate_hz} Hz${s.has_gyro ? "" : " (no gyroscope!)"}` : "No sensor data arriving";
    if (s.recording !== recording) setRecording(s.recording);
  } catch { $("status").textContent = "Server offline"; }
}, 1000);
</script>
</body>
</html>
