<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus Police</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1c2b33; --muted: #6a7880; --line: #e2e0d8;
    --on: #1f8a70; --off: #d1492e; --neutral: #9aa4a8; --accent: #1c2b33;
    --c-writing: #1f8a70; --c-typing: #3aa98f; --c-calculator: #86c5b4;
    --c-drinking: #c9a227; --c-phone: #d1492e; --c-idle: #e89a85;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12181b; --card: #1b2327; --ink: #eef1f0; --muted: #93a0a6; --line: #2b363b; --accent: #eef1f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .01em; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted);
          white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
  .pill.live .dot { background: var(--on); }
  .pill.down .dot { background: var(--off); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  #activity { font-size: 40px; font-weight: 650; line-height: 1.1; text-transform: capitalize; }
  #focus { display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 600; padding: 4px 10px;
           border-radius: 999px; color: #fff; background: var(--neutral); }
  #focus.on { background: var(--on); } #focus.off { background: var(--off); }
  .bar { height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--off); border-radius: 999px; transition: width .3s linear; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 64px; display: block; border-radius: 8px; background: var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px;
                         margin-right: 5px; background: var(--sw); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats .big { display: block; }
  .stats small { color: var(--muted); font-size: 12px; }
  .actions { display: flex; gap: 8px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); min-height: 44px; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #nudge { display: none; background: var(--off); color: #fff; border: 0; text-align: center; font-weight: 650; font-size: 18px; }
  #nudge.show { display: block; }
  #note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Focus Police</h1>
    <span class="pill" id="conn"><span class="dot"></span><span id="connText">Connecting</span></span>
  </header>

  <div class="card" id="nudge">Two minutes out of focus. Back to work.</div>

  <section class="card">
    <div class="label">Current activity</div>
    <div id="activity">Waiting</div>
    <span id="focus">No data</span>
    <div id="note"></div>
  </section>

  <section class="card">
    <div class="row"><div class="label">Time out of focus</div><div class="big" id="counter">0:00 / 2:00</div></div>
    <div class="bar"><div id="fill"></div></div>
  </section>

  <section class="card">
    <div class="row"><div class="label">Focus timeline</div><div class="label" id="span">last 10 min</div></div>
    <canvas id="timeline" height="64"></canvas>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card stats">
    <div><span class="big" id="tOn">0:00</span><small>In focus</small></div>
    <div><span class="big" id="tOff">0:00</span><small>Out of focus</small></div>
    <div><span class="big" id="nNudges">0</span><small>Nudges</small></div>
  </section>

  <div class="actions">
    <button class="primary" id="sound">Enable sound</button>
    <button id="reset">Reset session</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const WINDOW_S = 600;
let timeline = [], classes = [], audio = null, nudgeTimer = null;

function beep() {
  if (!audio) return;
  [0, 0.25, 0.5].forEach(d => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, audio.currentTime + d);
    g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d + 0.18);
    o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.2);
  });
}

$("sound").onclick = () => {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  audio.resume(); beep();
  $("sound").textContent = "Sound on";
};
$("reset").onclick = async () => { await fetch("/api/reset", {method: "POST"}); timeline = []; draw(); };

function draw() {
  const c = $("timeline"), w = c.clientWidth, h = c.clientHeight, r = window.devicePixelRatio || 1;
  c.width = w * r; c.height = h * r;
  const g = c.getContext("2d"); g.scale(r, r); g.clearRect(0, 0, w, h);
  let on = 0, off = 0;
  timeline.forEach(e => { if (e.focus === "on") on++; else if (e.focus === "off") off++; });
  $("tOn").textContent = mmss(on); $("tOff").textContent = mmss(off);
  if (!timeline.length) return;
  const end = timeline[timeline.length - 1].t, start = end - WINDOW_S, px = w / WINDOW_S;
  for (const e of timeline) {
    if (e.t < start) continue;
    const x = (e.t - start) * px;
    g.fillStyle = css(`--${e.focus === "on" ? "on" : e.focus === "off" ? "off" : "neutral"}`);
    g.fillRect(x - px, 0, px + 0.6, h * 0.62);
    g.fillStyle = css(`--c-${e.activity}`) || css("--neutral");
    g.fillRect(x - px, h * 0.68, px + 0.6, h * 0.32);
  }
}

function render(s) {
  const conn = $("conn");
  conn.className = "pill " + (s.connected ? "live" : "down");
  $("connText").textContent = s.connected ? `Live · ${s.rate_hz} Hz` : "No signal";
  let note = "";
  if (!s.has_model) note = "No trained model loaded. Train one, then restart the server.";
  else if (s.connected && !s.has_gyro) note = "Receiving acceleration but no gyroscope.";
  $("note").textContent = note;
  $("activity").textContent = s.connected && s.activity ? s.activity : (s.connected ? "Warming up" : "Waiting");
  const f = $("focus");
  f.className = s.connected && s.activity ? s.focus : "";
  f.textContent = !s.connected || !s.activity ? "No data" :
    s.focus === "on" ? "In focus" : s.focus === "off" ? "Out of focus" : "Neutral";
  $("counter").textContent = `${mmss(s.counter_s)} / ${mmss(s.nudge_after_s)}`;
  $("fill").style.width = Math.min(100, 100 * s.counter_s / s.nudge_after_s) + "%";
  $("nNudges").textContent = s.nudges;
  if (s.new && s.new.length) { timeline.push(...s.new); if (timeline.length > 7200) timeline = timeline.slice(-7200); draw(); }
  if (s.nudge) {
    beep();
    $("nudge").classList.add("show");
    clearTimeout(nudgeTimer);
    nudgeTimer = setTimeout(() => $("nudge").classList.remove("show"), 8000);
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "init") {
      timeline = m.timeline; classes = m.classes;
      $("legend").innerHTML = ["on:In focus", "off:Out of focus", "neutral:Neutral"]
        .map(x => x.split(":")).map(([k, t]) => `<span style="--sw: var(--${k})">${t}</span>`).join("") +
        classes.map(c => `<span style="--sw: var(--c-${c})">${c}</span>`).join("");
      draw();
    } else render(m);
  };
  ws.onclose = () => { $("conn").className = "pill down"; $("connText").textContent = "Server offline"; setTimeout(connect, 1500); };
}
connect();
window.addEventListener("resize", draw);
</script>
</body>
</html>
