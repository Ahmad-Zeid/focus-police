[project]
name = "focuspolice"
version = "0.1.0"
description = "Focus Police: tell working from drifting with a wrist motion sensor (AUB CMPS 297 final project)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["focuspolice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
